name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # ponytail: Linux-only zasad — dev + dogfood teku na Piju (Linux). Windows
    # ima poznate cross-OS rupe (hrvatski Č/cp1252 encoding, path separatori,
    # drive-mismatch, subprocess kill) koje CI je ulovio; zaseban Windows-compat
    # zadatak prije bilo kakvog Windows deploya (vidi docs/WINDOWS_COMPAT.md).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # pin na validirane verzije (reproducibilan CI == lokalni env); novija
          # starlette 1.3+ mijenja kako TestClient izlaže Set-Cookie
          pip install pytest httpx "fastapi==0.135.3" "starlette==1.1.0"
      - name: Test
        run: python -m pytest -q
