[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "python-multipart>=0.0.9", "cryptography", "llmfit>=1.1", "windows-curses>=2.3; sys_platform == 'win32'"]

[project.scripts]
atlas = "atlas.__main__:main"
ragspine = "atlas.__main__:main"  # compat: stari CLI, do v2

[project.optional-dependencies]
full = ["pymupdf", "fastembed", "sqlite-vec", "python-docx", "openpyxl", "apprise"]
mail = ["exchangelib", "msal", "requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["atlas*"]
