[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragspine"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "python-multipart>=0.0.9"]

[project.scripts]
ragspine = "ragspine.__main__:main"

[project.optional-dependencies]
full = ["pymupdf", "fastembed", "sqlite-vec", "python-docx", "openpyxl", "apprise", "cryptography"]
mail = ["exchangelib", "msal", "requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ragspine*"]
