[project]
name = "ragspine"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]

[project.optional-dependencies]
full = ["pymupdf", "fastembed", "sqlite-vec", "python-docx", "openpyxl", "apprise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
